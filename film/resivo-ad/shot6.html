<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>06 — End card</title>
<link rel="stylesheet" href="theme.css">
<style>
  .stage { background: #071C33; }

  .bg {
    position: absolute; inset: -10%;
    background: linear-gradient(135deg, #08203D 0%, #0A2F5A 30%, #0D5A70 62%, #0D7180 82%, #0CA792 100%);
  }
  .sun {
    position: absolute; width: 110vmin; height: 110vmin; border-radius: 50%;
    left: 50%; top: 8%; margin-left: -55vmin;
    background: radial-gradient(circle, rgba(241, 206, 146, 0.30) 0%, rgba(241, 206, 146, 0.06) 40%, rgba(241, 206, 146, 0) 68%);
  }
  .sweep {
    position: absolute; top: -60%; left: -40%; width: 60%; height: 220%;
    background: linear-gradient(100deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.10) 45%, rgba(255, 255, 255, 0) 100%);
    transform: rotate(14deg);
  }
  .mesh {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.04) 0.12vmin, transparent 0.12vmin),
      linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0.12vmin, transparent 0.12vmin);
    background-size: 14vmin 14vmin;
    mask-image: radial-gradient(80vmin 70vmin at 50% 46%, #000 0%, transparent 72%);
  }

  .card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .logo { width: 24vmin; height: auto; opacity: 0; transform-origin: 50% 50%; }
  .rule { width: 7vmin; height: 0.42vmin; background: var(--gold-500); margin: 4.6vmin 0 3.6vmin; }
  .tag {
    font: 600 5.1vmin/1.15 Outfit, sans-serif; color: #FFFFFF; letter-spacing: -0.022em;
    max-width: 96vmin;
  }
  .ln { display: block; }
  .ln span { display: block; }
  .cta {
    margin-top: 5vmin; display: inline-flex; align-items: center; gap: 1.3vmin;
    border: 0.22vmin solid rgba(241, 206, 146, 0.62); border-radius: 99vmin;
    padding: 1.5vmin 3.4vmin; font: 600 2.35vmin/1 Inter, sans-serif; color: var(--gold-300);
    letter-spacing: 0.02em; opacity: 0;
  }
  .cta i { width: 0.8vmin; height: 0.8vmin; border-right: 0.28vmin solid currentColor; border-top: 0.28vmin solid currentColor; transform: rotate(45deg); display: block; }
  .small {
    margin-top: 3.2vmin; font: 500 1.85vmin/1 Inter, sans-serif; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(230, 237, 246, 0.55); opacity: 0;
  }
  .vig { position: absolute; inset: 0; background: radial-gradient(100vmin 80vmin at 50% 45%, rgba(0,0,0,0) 40%, rgba(3, 14, 26, 0.55) 100%); }

  /* 9:16 — a taller card: mark a little larger, the line held to a readable measure */
  @media (aspect-ratio < 1) {
    .logo { width: 30vmin; }
    .tag { max-width: 84vmin; font-size: 6vmin; }
    .cta { font-size: 2.9vmin; padding: 1.9vmin 4.2vmin; margin-top: 6vmin; }
    .small { font-size: 2.05vmin; letter-spacing: 0.15em; margin-top: 3.8vmin; }
    .rule { margin: 5.4vmin 0 4.2vmin; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <div class="sun" id="sun"></div>
  <div class="mesh"></div>
  <div class="sweep" id="sweep"></div>
  <div class="vig"></div>

  <div class="card">
    <img class="logo" id="logo" src="assets/logo-white.png" alt="RÉSIVO">
    <div class="rule" id="rule"></div>
    <div class="tag">
      <span class="ln"><span id="l1">The residence,</span></span>
      <span class="ln"><span id="l2">one tap away.</span></span>
    </div>
    <div class="cta" id="cta">resivo-orcin.vercel.app <i></i></div>
    <div class="small" id="small">Cité universitaire · Tlemcen</div>
  </div>
  <div class="grain" style="opacity:.22"></div>
</div>

<script type="module">
import { mix, ramp, easeOut, easeOut5 } from './lib.js';

const bg = document.getElementById('bg');
const sun = document.getElementById('sun');
const sweep = document.getElementById('sweep');
const logo = document.getElementById('logo');
const rule = document.getElementById('rule');
const l1 = document.getElementById('l1');
const l2 = document.getElementById('l2');
const cta = document.getElementById('cta');
const small = document.getElementById('small');

const ready = new Promise((res) => {
  if (logo.complete) return res();
  logo.addEventListener('load', res, { once: true });
  logo.addEventListener('error', res, { once: true });
});

window.film = {
  duration: 3,
  ready: Promise.all([document.fonts.ready, ready]),
  frame(t) {
    const drift = ramp(t, 0, 3);

    // the courtyard light keeps drifting under the card
    bg.style.transform = `scale(${1 + 0.03 * drift}) translate(${mix(0, -1, drift)}%, ${mix(0, -0.8, drift)}%)`;
    sun.style.transform = `translate(${mix(-2, 3, drift)}vmin, ${mix(1, -3, drift)}vmin) scale(${mix(1, 1.12, drift)})`;
    sun.style.opacity = String(mix(0.7, 1, easeOut(ramp(t, 0, 2.2))));

    // a single soft light sweep across the card
    const sw = ramp(t, 0.9, 2.4);
    sweep.style.transform = `rotate(14deg) translateX(${mix(-30, 190, easeOut(sw))}%)`;
    sweep.style.opacity = String(sw > 0 && sw < 1 ? Math.sin(sw * Math.PI) * 0.9 : 0);

    // the mark
    const lp = easeOut5(ramp(t, 0, 0.65));
    logo.style.opacity = String(0.62 + 0.38 * lp);
    logo.style.transform = `translateY(${mix(1.6, 0, lp)}vmin) scale(${mix(0.975, 1, lp) + 0.012 * drift})`;

    rule.style.transform = `scaleX(${easeOut5(ramp(t, 0, 0.5))})`;
    rule.style.transformOrigin = 'center center';
    const p1 = easeOut5(ramp(t, 0.08, 0.6));
    l1.style.transform = `translateY(${mix(0.32, 0, p1)}em)`;
    l1.style.opacity = String(0.55 + 0.45 * p1);
    const p2 = easeOut5(ramp(t, 0.2, 0.75));
    l2.style.transform = `translateY(${mix(0.32, 0, p2)}em)`;
    l2.style.opacity = String(0.55 + 0.45 * p2);

    const cp = ramp(t, 1.2, 1.65);
    cta.style.opacity = String(cp);
    cta.style.transform = `translateY(${mix(1.4, 0, easeOut(cp))}vmin)`;
    const sp = ramp(t, 1.45, 1.9);
    small.style.opacity = String(sp * 0.9);
  }
};
</script>
</body>
</html>
